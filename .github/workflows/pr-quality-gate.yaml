name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  lint:
    name: Code and Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome (lint + format check)
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Trivy (Vulnerability Scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_IDENTIDADE_CARIOCA_BASE_URL: "https://auth-idriohom.apps.rio.gov.br/auth/realms/idrio_cidadao/protocol/openid-connect"
          NEXT_PUBLIC_IDENTIDADE_CARIOCA_CLIENT_ID: "superapp"
          NEXT_PUBLIC_IDENTIDADE_CARIOCA_REDIRECT_URI: "https://staging.app.dados.rio/api/auth/callback/keycloak"
          NEXT_PUBLIC_HOME_URL: "https://staging.app.dados.rio/"
          NEXT_PUBLIC_GOVBR_BASE_URL: "https://sso.staging.acesso.gov.br/"
          NEXT_PUBLIC_USE_GOVBR_HINT: "false"
          GOOGLE_MAPS_API_KEY: "placeholder"
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: "G-0970HR3V20"
          NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: "GTM-TQZT3J9G"
          API_KEY_SUBPAV_OSA_SMS: "placeholder"
          NEXT_PUBLIC_ENABLE_HARDCODED_SEARCH_LINKS: "true"
          NEXT_PUBLIC_FEATURE_FLAG: "false"
          NEXT_PUBLIC_HAND_TALK_TOKEN: "c84d3e127f66af2cee4bfe289c58537a"
          NEXT_PUBLIC_EQUALWEB_SITEKEY: "f010fd59983a9d10102605f5740d45fd"
          NEXT_PUBLIC_PERTO_DIGITAL_ENABLED: "true"

      # Prepara a credencial de E2E:
      #  - PR de fork  → E2E_REQUIRE_AUTH=false (GitHub não passa secrets a forks;
      #    roda só o público, sem falhar).
      #  - Push / PR same-repo → E2E_REQUIRE_AUTH=true e obtém um access_token:
      #    preferencialmente MINTADO na hora a partir de um refresh_token (não
      #    expira entre execuções); fallback para o token estático. Se nenhum
      #    estiver disponível, o canário (auth-canary.spec.ts) falha alto.
      - name: Prepare E2E auth (mint fresh token / detect fork)
        env:
          KC_BASE: "https://auth-idriohom.apps.rio.gov.br/auth/realms/idrio_cidadao/protocol/openid-connect"
          KC_CLIENT_ID: "superapp"
          KC_CLIENT_SECRET: ${{ secrets.IDENTIDADE_CARIOCA_CLIENT_SECRET }}
          E2E_REFRESH_TOKEN: ${{ secrets.E2E_REFRESH_TOKEN }}
          E2E_ACCESS_TOKEN_STATIC: ${{ secrets.E2E_ACCESS_TOKEN }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -uo pipefail
          if [ "$IS_FORK" = "true" ]; then
            echo "E2E_REQUIRE_AUTH=false" >> "$GITHUB_ENV"
            echo "PR de fork: secrets indisponíveis — E2E roda apenas testes públicos."
            exit 0
          fi
          echo "E2E_REQUIRE_AUTH=true" >> "$GITHUB_ENV"

          TOKEN=""
          # Preferir mintar um access_token FRESCO a partir do refresh_token.
          if [ -n "${E2E_REFRESH_TOKEN:-}" ] && [ -n "${KC_CLIENT_SECRET:-}" ]; then
            TOKEN=$(curl -sf -X POST "$KC_BASE/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=$KC_CLIENT_ID" \
              --data-urlencode "client_secret=$KC_CLIENT_SECRET" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=$E2E_REFRESH_TOKEN" \
              | jq -r '.access_token // empty' 2>/dev/null || true)
            [ -n "$TOKEN" ] && echo "Access token mintado a partir do refresh_token."
          fi
          # Fallback: token estático (pode expirar — prefira o refresh_token).
          if [ -z "$TOKEN" ] && [ -n "${E2E_ACCESS_TOKEN_STATIC:-}" ]; then
            TOKEN="$E2E_ACCESS_TOKEN_STATIC"
            echo "Usando E2E_ACCESS_TOKEN estático (fallback)."
          fi
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "E2E_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          else
            echo "::warning::Nenhum token E2E disponível num run que EXIGE auth — o canário vai falhar. Configure E2E_REFRESH_TOKEN + IDENTIDADE_CARIOCA_CLIENT_SECRET (ou E2E_ACCESS_TOKEN) nos secrets."
          fi

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
          PORT: "3000"
          # E2E_ACCESS_TOKEN e E2E_REQUIRE_AUTH vêm do passo anterior (via $GITHUB_ENV).
          COURSES_BASE_API_URL: 'https://services.staging.app.dados.rio/go'
          BASE_API_URL_APP_BUSCA_SEARCH: 'https://services.staging.app.dados.rio/app-busca-search/'
          BASE_API_URL_SUBPAV_OSA_API: 'https://services.staging.app.dados.rio/subpav-osa-api/'
          BASE_API_URL_RMI: 'https://services.staging.app.dados.rio/rmi/'
          BASE_API_URL_APP_CATALOGO: 'https://services.staging.app.dados.rio/catalogo/'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Docker Build Dry Run
    runs-on: ubuntu-latest
    needs: [lint, security-scan, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (dry run - staging args)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_IDENTIDADE_CARIOCA_BASE_URL="https://auth-idriohom.apps.rio.gov.br/auth/realms/idrio_cidadao/protocol/openid-connect" \
            --build-arg NEXT_PUBLIC_IDENTIDADE_CARIOCA_CLIENT_ID="superapp" \
            --build-arg NEXT_PUBLIC_IDENTIDADE_CARIOCA_REDIRECT_URI="https://staging.app.dados.rio/api/auth/callback/keycloak" \
            --build-arg NEXT_PUBLIC_HOME_URL="https://staging.app.dados.rio/" \
            --build-arg NEXT_PUBLIC_GOVBR_BASE_URL="https://sso.staging.acesso.gov.br/" \
            --build-arg NEXT_PUBLIC_USE_GOVBR_HINT="false" \
            --build-arg GOOGLE_MAPS_API_KEY="GOOGLE_MAPS_API_KEY" \
            --build-arg NEXT_PUBLIC_GOOGLE_ANALYTICS_ID="G-0970HR3V20" \
            --build-arg NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID="GTM-TQZT3J9G" \
            --build-arg API_KEY_SUBPAV_OSA_SMS="API_KEY_SUBPAV_OSA_SMS" \
            --build-arg NEXT_PUBLIC_ENABLE_HARDCODED_SEARCH_LINKS="true" \
            --build-arg NEXT_PUBLIC_FEATURE_FLAG="false" \
            --build-arg NEXT_PUBLIC_HAND_TALK_TOKEN="17a931fe38db57f3f3db2f9d8745f29b" \
            --build-arg NEXT_PUBLIC_EQUALWEB_SITEKEY="f010fd59983a9d10102605f5740d45fd" \
            --build-arg NEXT_PUBLIC_PERTO_DIGITAL_ENABLED="true" \
            --tag ghcr.io/${{ github.repository_owner }}/superapp:pr-${{ github.event.pull_request.number }} \
            --load \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/superapp:pr-${{ github.event.pull_request.number }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [lint, security-scan, test, build, e2e]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Find previous quality gate comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🚦 PR Quality Gate Results'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚦 PR Quality Gate Results

            | Check | Status |
            |-------|--------|
            | Code Linting + TypeScript | ${{ needs.lint.result == 'success' && '✅ Passed' || needs.lint.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Security Scanning | ${{ needs.security-scan.result == 'success' && '✅ Passed' || needs.security-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Unit Tests | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Docker Build | ${{ needs.build.result == 'success' && '✅ Passed' || needs.build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | E2E Tests | ${{ needs.e2e.result == 'success' && '✅ Passed' || needs.e2e.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |

            ---

            ${{ needs.lint.result == 'success' && needs.security-scan.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && '### ✅ All quality checks passed - PR is ready to merge' || '### ❌ Quality gate failed - PR is not ready to merge' }}

            **Commit**: ${{ github.event.pull_request.head.sha }}
            **Run**: [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Fail workflow if any check failed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            exit 1
          fi

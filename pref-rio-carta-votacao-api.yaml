openapi: 3.0.3
info:
  title: Votação de artigos da Carta de Serviço
  version: 1.0.0
  license:
    name: Uso interno — Prefeitura da Cidade do Rio de Janeiro
    url: https://prefeitura.rio
  description: |
    Registra (ou substitui) o voto de um visitante sobre um artigo da Carta de Serviço.
    O voto é anônimo e deduplicado por `voterToken` + artigo; repetir a chamada não duplica.

    Erros do Apex vêm em `{ error: { code, message } }`.
    Erros da plataforma Salesforce (token expirado, limite de API, indisponibilidade)
    vêm como uma lista `[{ message, errorCode }]`.

    O campo `rejectionDescription` (máx. 500) só é aproveitado com o chip `Outro_motivo`.
    Em voto `up`, `rejectionReasons` e `rejectionDescription` são ignorados.
servers:
  - url: https://prefeitura-rio.my.salesforce.com/services/apexrest/apis/public
    description: Produção
security:
  - oauth2ClientCredentials: []
paths:
  /services/{slug}/vote:
    post:
      operationId: postArticleVote
      summary: Registra ou substitui o voto de um visitante
      description: |
        O `slug` é o mesmo devolvido em `data.slug` pelo GET do detalhe do serviço.
        O `articleId` é o `data.articleId` do GET (Id da versão do artigo).
      tags:
        - Votacao
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug do artigo (data.slug do GET do detalhe)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Voto registrado. O corpo traz o placar atualizado do artigo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '400':
          description: Erro de validação do contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente ou inválido, ou falha de autenticação da plataforma
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/SalesforcePlatformError'
        '403':
          description: Chamador autenticado sem permissão ou limite diário de API esgotado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesforcePlatformError'
        '404':
          description: Slug não corresponde a artigo publicado, ou artigo fora da carta pública
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Falha inesperada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Salesforce indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesforcePlatformError'
components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: Client Credentials do External Client App do portal.
      flows:
        clientCredentials:
          tokenUrl: https://prefeitura-rio.my.salesforce.com/services/oauth2/token
          scopes:
            api: Acesso à API na forma do usuário de integração
  schemas:
    RejectionReason:
      type: string
      description: Motivo do voto negativo, pelo API name (ASCII), não pelo label.
      enum:
        - Informacao_desatualizada
        - Informacao_incompleta
        - Dificil_de_entender
        - Nao_encontrei_o_que_precisava
        - Informacao_incorreta
        - Outro_motivo
    VoteRequest:
      description: |
        Um dos dois formatos, escolhido pelo valor de `vote`.
        Em `up`, `rejectionReasons` e `rejectionDescription` são ignorados.
      oneOf:
        - $ref: '#/components/schemas/VoteUpRequest'
        - $ref: '#/components/schemas/VoteDownRequest'
      discriminator:
        propertyName: vote
        mapping:
          up: '#/components/schemas/VoteUpRequest'
          down: '#/components/schemas/VoteDownRequest'
    VoteUpRequest:
      type: object
      required:
        - articleId
        - vote
        - voterToken
      properties:
        articleId:
          type: string
          description: data.articleId devolvido pelo GET do detalhe
        vote:
          type: string
          enum:
            - up
        voterToken:
          type: string
          description: Identificador anônimo de sessão, gerado pelo backend do portal
        rejectionReasons:
          type: array
          description: Ignorado quando vote=up
          items:
            $ref: '#/components/schemas/RejectionReason'
        rejectionDescription:
          type: string
          maxLength: 500
          nullable: true
          description: Ignorado quando vote=up
    VoteDownRequest:
      type: object
      required:
        - articleId
        - vote
        - voterToken
        - rejectionReasons
      properties:
        articleId:
          type: string
          description: data.articleId devolvido pelo GET do detalhe
        vote:
          type: string
          enum:
            - down
        voterToken:
          type: string
          description: Identificador anônimo de sessão, gerado pelo backend do portal
        rejectionReasons:
          type: array
          minItems: 1
          description: Ao menos um chip
          items:
            $ref: '#/components/schemas/RejectionReason'
        rejectionDescription:
          type: string
          maxLength: 500
          nullable: true
          description: Opcional; só é aproveitado com o chip Outro_motivo
    Helpfulness:
      type: object
      required:
        - up
        - down
        - score
      properties:
        up:
          type: integer
          description: Total de votos positivos
        down:
          type: integer
          description: Total de votos negativos
        score:
          type: number
          format: double
          nullable: true
          description: up / (up + down); nulo quando não há votos
    VoteResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Helpfulness'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - NOT_FOUND
                - INTERNAL_ERROR
            message:
              type: string
              description: Descritiva; pode mudar. O `code` é o contrato.
    SalesforcePlatformError:
      type: array
      description: Erro da plataforma Salesforce (token, limite de API, indisponibilidade)
      items:
        type: object
        required:
          - message
          - errorCode
        properties:
          message:
            type: string
          errorCode:
            type: string
            example: INVALID_SESSION_ID

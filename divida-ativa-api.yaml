          description: "Indica se o imovel ja esta em Meus Imoveis do CPF autenticado.\
            \ Falso na consulta avulsa de imovel nao cadastrado: nesse caso a resposta\
            \ e somente leitura e opcoes vem vazia, porque emitir guia e requerer\
            \ parcelamento exigem o cadastro."

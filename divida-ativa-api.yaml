---
openapi: 3.0.3
info:
  title: api-imoveis
  description: Cadastro local de inscricoes imobiliarias e servicos de IPTU / Divida
    Ativa.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
tags:
- name: Divida Ativa
  description: "Servicos de Divida Ativa via DAM (menu integral do portlet legado),\
    \ com autorizacao por imovel cadastrado."
- name: Divida Ativa - Requerimentos
  description: "Acompanhamento, reauth e utilitarios de Divida Ativa."
- name: Imoveis
  description: Cadastro local de inscricoes imobiliarias e montagem das opcoes de
    IPTU no ePortal.
- name: Infra
  description: Endpoints simples de diagnostico da API.
paths:
  /divida-ativa/cep/{cep}:
    get:
      tags:
      - Divida Ativa - Requerimentos
      summary: Consulta endereco por CEP (ViaCEP; substituto do SOAP SMF INT-27 na
        POC)
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Endereco correspondente ao CEP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoCepResponse'
      security:
      - bearerAuth: []
  /divida-ativa/certidoes:
    get:
      tags:
      - Divida Ativa - Requerimentos
      summary: Consulta certidao de situacao fiscal por protocolo (PGM) — fora do
        menu ativo
      parameters:
      - name: protocolo
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Certidao de situacao fiscal do protocolo informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertidaoDamResponse'
      security:
      - bearerAuth: []
  /divida-ativa/consultar:
    post:
      tags:
      - Divida Ativa - Requerimentos
      summary: "Consulta avulsa por CDA, execucao fiscal, guia ou inscricao — nao\
        \ exige imovel cadastrado (somente leitura)"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaFiltroRequest'
      responses:
        "200":
          description: "Consulta somente leitura. imovelCadastrado indica se o imovel\
            \ ja esta em Meus Imoveis; quando false, opcoes vem vazia."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividaAtivaConsultaResponse'
      security:
      - bearerAuth: []
  /divida-ativa/requerimentos:
    get:
      tags:
      - Divida Ativa - Requerimentos
      summary: Lista requerimentos do CPF autenticado ou consulta por protocolo
      parameters:
      - name: protocolo
        in: query
        description: Protocolo opcional
        schema:
          type: string
      responses:
        "200":
          description: "Requerimentos do CPF autenticado, ou o requerimento do protocolo\
            \ informado."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequerimentoParcelamentoResponse'
      security:
      - bearerAuth: []
  /divida-ativa/requerimentos/{id}/cancelar:
    post:
      tags:
      - Divida Ativa - Requerimentos
      summary: Cancela requerimento de parcelamento do contribuinte
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Requerimento apos o cancelamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequerimentoParcelamentoResponse'
      security:
      - bearerAuth: []
  /divida-ativa/requerimentos/{id}/comprovante:
    get:
      tags:
      - Divida Ativa - Requerimentos
      summary: Gera URL do comprovante/protocolo do requerimento
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: URL do comprovante do requerimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfUrlResponse'
      security:
      - bearerAuth: []
  /divida-ativa/requerimentos/{id}/formulario:
    get:
      tags:
      - Divida Ativa - Requerimentos
      summary: "Gera formulário da guia do requerimento (numVia=1, qtdeCotas=12)"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: URL do formulario da guia do requerimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfUrlResponse'
      security:
      - bearerAuth: []
  /divida-ativa/validar-senha:
    post:
      tags:
      - Divida Ativa - Requerimentos
      summary: Revalida senha do usuario autenticado (INT-24 / RN-036)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarSenhaRequest'
      responses:
        "200":
          description: "Resultado da revalidacao. Responde 200 tambem quando a senha\
            \ e invalida: o campo valido carrega o resultado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidarSenhaResponse'
      security:
      - bearerAuth: []
  /imoveis:
    get:
      tags:
      - Imoveis
      summary: Lista os imoveis cadastrados do usuario autenticado
      description: "Valida o JWT no Keycloak, extrai o CPF da claim preferred_username\
        \ e consulta somente o banco local dbo.tbNC_Imovel. Nao chama WS Fazenda nem\
        \ ePortal."
      responses:
        "200":
          description: Lista de imoveis cadastrados para o CPF autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImovelResponse'
        "401":
          description: "JWT ausente, invalido ou expirado."
        "503":
          description: Falha ao validar token no Keycloak.
      security:
      - bearerAuth: []
    post:
      tags:
      - Imoveis
      summary: Cadastra uma inscricao imobiliaria para o usuario
      description: "Valida o JWT, consulta o WSFazenda_Iptu para buscar o endereco\
        \ da inscricao informada e grava o imovel no banco local dbo.tbNC_Imovel vinculado\
        \ ao CPF autenticado."
      requestBody:
        description: Inscricao imobiliaria a cadastrar. Pode conter mascara ou vir
          sem zeros a esquerda; a API considera apenas digitos e normaliza para 8
          posicoes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImovelRequest'
        required: true
      responses:
        "201":
          description: Imovel cadastrado com endereco retornado pelo WS Fazenda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImovelResponse'
        "400":
          description: Inscricao invalida ou sem endereco retornado pelo WS Fazenda.
        "401":
          description: "JWT ausente, invalido ou expirado."
        "503":
          description: Falha de validacao no Keycloak ou indisponibilidade de integracao.
      security:
      - bearerAuth: []
  /imoveis/{id}:
    delete:
      tags:
      - Imoveis
      summary: Remove um imovel cadastrado
      description: "Valida o JWT e remove do banco local o registro pelo id, desde\
        \ que ele pertenca ao CPF autenticado. Nao remove dados em sistemas da Fazenda."
      parameters:
      - name: id
        in: path
        description: Id local do imovel em dbo.tbNC_Imovel.
        required: true
        schema:
          format: int64
          type: integer
        example: 1
      responses:
        "204":
          description: Imovel removido do cadastro local.
        "401":
          description: "JWT ausente, invalido ou expirado."
        "404":
          description: Imovel nao encontrado para o CPF autenticado.
      security:
      - bearerAuth: []
    patch:
      tags:
      - Imoveis
      summary: Renomeia um imovel cadastrado
      description: "Valida o JWT e troca o nome do registro local pelo id, desde que\
        \ ele pertenca ao CPF autenticado. So o nome muda: inscricao e endereco vem\
        \ do WSFazenda_Iptu e nao sao editaveis. Corpo sem nome apaga o nome gravado."
      parameters:
      - name: id
        in: path
        description: Id local do imovel em dbo.tbNC_Imovel.
        required: true
        schema:
          format: int64
          type: integer
        example: 1
      requestBody:
        description: "Novo nome do imovel. Ausente, vazio ou so espacos apaga o nome\
          \ gravado."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImovelRenomearRequest'
        required: true
      responses:
        "200":
          description: Imovel renomeado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImovelResponse'
        "400":
          description: Nome acima do tamanho maximo ou com caracteres invalidos.
        "401":
          description: "JWT ausente, invalido ou expirado."
        "404":
          description: Imovel nao encontrado para o CPF autenticado.
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/cadastro:
    get:
      tags:
      - Imoveis
      summary: Consulta os dados cadastrais do imovel no WSFazenda_Iptu
      description: "Valida o JWT no Keycloak e, a partir da inscricao imobiliaria,\
        \ consulta o WSFazenda_Iptu e retorna os dados cadastrais do imovel (endereco\
        \ e inscricao normalizada). Nao consulta o banco local. Retorna lista vazia\
        \ quando nao houver registro para a inscricao."
      parameters:
      - name: inscricao
        in: path
        description: Inscricao imobiliaria a consultar. Pode vir sem zeros a esquerda;
          a API normaliza para 8 posicoes.
        required: true
        schema:
          type: string
        example: "00000018"
      responses:
        "200":
          description: Dados cadastrais do imovel retornados pelo WS Fazenda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FazendaImovel'
        "400":
          description: Inscricao invalida.
        "401":
          description: "JWT ausente, invalido ou expirado."
        "503":
          description: Falha ao validar token no Keycloak ou ao consultar o WSFazenda_Iptu.
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/consulta:
    get:
      tags:
      - Imoveis
      summary: Consulta o imovel e monta as opcoes disponiveis de IPTU
      description: "Agrega dados do banco local com opcoes do ePortal. Primeiro busca\
        \ o imovel em dbo.tbNC_Imovel pelo CPF autenticado e inscricao. Depois chama\
        \ o SOAP manual do ePortal para verificar parcelamento e segunda via, retornando\
        \ URLs com token cripto apenas quando o ePortal informar disponibilidade.\
        \ Nao chama o WSFazenda_Iptu neste endpoint."
      parameters:
      - name: inscricao
        in: path
        description: Inscricao imobiliaria ja cadastrada para o usuario. Pode vir
          sem zeros a esquerda; a API normaliza para 8 posicoes.
        required: true
        schema:
          type: string
        example: "00000018"
      - name: exercicio
        in: query
        description: "Exercicio usado na geracao do token da segunda via. Para anos\
          \ anteriores, informar explicitamente; se omitido, usa o ano corrente."
        schema:
          type: string
        example: 2025
      responses:
        "200":
          description: Imovel cadastrado e opcoes de parcelamento/segunda via.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImovelConsultaResponse'
        "401":
          description: "JWT ausente, invalido ou expirado."
        "404":
          description: Inscricao nao cadastrada para o CPF autenticado.
        "503":
          description: Falha ao consultar Keycloak ou ePortal.
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa:
    get:
      tags:
      - Divida Ativa
      summary: "Consulta principal: CDAs + guias parceladas + menu (inscricao do path)"
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "CDAs nao parceladas, guias parceladas, totais e menu de opcoes\
            \ do imovel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividaAtivaConsultaResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/certidoes/requerimento:
    post:
      tags:
      - Divida Ativa
      summary: Envia requerimento de certidao de situacao fiscal (PGM)
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequerimentoCertidaoRequest'
      responses:
        "201":
          description: Requerimento de certidao aberto na PGM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertidaoDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/consultar:
    post:
      tags:
      - Divida Ativa
      summary: "Consulta com criterio unico (inscricao, CDA, execucao ou guia) — RN-001/RN-002"
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaFiltroRequest'
      responses:
        "200":
          description: "Mesma resposta da consulta principal, filtrada por criterio\
            \ unico."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividaAtivaConsultaResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/datas-vencimento:
    get:
      tags:
      - Divida Ativa
      summary: Datas de vencimento (a vista ou parcelamento)
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      - name: tipo
        in: query
        description: AVISTA ou PARCELAMENTO
        schema:
          type: string
      responses:
        "200":
          description: Datas de vencimento aceitas para a operacao escolhida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasVencimentoResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/emitir/avista:
    post:
      tags:
      - Divida Ativa
      summary: Emite guia a vista e tenta gerar URL de PDF
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaOperacaoRequest'
      responses:
        "200":
          description: "Guia a vista emitida, com linha digitavel e URL de PDF quando\
            \ disponivel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/emitir/liquidacao:
    post:
      tags:
      - Divida Ativa
      summary: Emite liquidacao de guia
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaOperacaoRequest'
      responses:
        "200":
          description: Guia de liquidacao emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/emitir/regularizacao:
    post:
      tags:
      - Divida Ativa
      summary: Emite regularizacao
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaOperacaoRequest'
      responses:
        "200":
          description: Guia de regularizacao emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/guias/continuacao:
    get:
      tags:
      - Divida Ativa
      summary: Guias para segunda via de parcelamento
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      - name: numCda
        in: query
        schema:
          type: string
      - name: numExecucaoFiscal
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Guias de parcelamento disponiveis para segunda via.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/guias/liquidacao:
    get:
      tags:
      - Divida Ativa
      summary: Guias disponiveis para liquidacao
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Guias disponiveis para liquidacao.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/guias/regularizacao:
    get:
      tags:
      - Divida Ativa
      summary: Guias com parcelas em atraso (regularizacao)
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      - name: numCda
        in: query
        schema:
          type: string
      - name: numExecucaoFiscal
        in: query
        schema:
          type: string
      - name: numGuiaPagamento
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Guias com parcelas em atraso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/guias/{numeroGuia}/pdf:
    get:
      tags:
      - Divida Ativa
      summary: "Gera URL publica de PDF da guia (cota unica, parcelamento ou formulario)"
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      - name: numeroGuia
        in: path
        required: true
        schema:
          type: string
      - name: tipo
        in: query
        schema:
          type: string
      responses:
        "200":
          description: URL publica do PDF da guia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfUrlResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/parcelamentos/simular:
    post:
      tags:
      - Divida Ativa
      summary: Simula parcelamentos possiveis
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelamentoSimularRequest'
      responses:
        "200":
          description: "Opcoes de parcelamento possiveis para as CDAs informadas,\
            \ com saldos e descontos por CDA."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulacaoParcelamentoResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/requerimentos:
    post:
      tags:
      - Divida Ativa
      summary: Envia requerimento de parcelamento (docs base64 + reauth senha + declaracao)
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequerimentoParcelamentoRequest'
      responses:
        "201":
          description: "Requerimento aberto no DAM, com protocolo e URL de comprovante."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequerimentoParcelamentoResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/simular/avista:
    post:
      tags:
      - Divida Ativa
      summary: Simula guia a vista
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaOperacaoRequest'
      responses:
        "200":
          description: "Guia a vista simulada, sem emissao."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/simular/liquidacao:
    post:
      tags:
      - Divida Ativa
      summary: Simula liquidacao de guia
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaOperacaoRequest'
      responses:
        "200":
          description: "Liquidacao simulada, sem emissao."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/divida-ativa/simular/regularizacao:
    post:
      tags:
      - Divida Ativa
      summary: Simula regularizacao de cotas em atraso
      parameters:
      - name: inscricao
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaOperacaoRequest'
      responses:
        "200":
          description: Cotas em atraso que compoem a regularizacao simulada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CotaDamResponse'
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/parcelamentos:
    get:
      tags:
      - Imoveis
      summary: Consulta somente a opcao de parcelamento
      description: "Valida o JWT, chama o SOAP manual do ePortal VerificaDebitosParcelamentoInInscricao\
        \ e retorna a URL de parcelamento com token cripto quando houver debitos parcelaveis.\
        \ Nao consulta o WSFazenda_Iptu."
      parameters:
      - name: inscricao
        in: path
        description: Inscricao imobiliaria usada na consulta ao ePortal. Pode vir
          sem zeros a esquerda; a API normaliza para 8 posicoes.
        required: true
        schema:
          type: string
        example: "00000018"
      responses:
        "200":
          description: "Lista contendo a opcao PARCELAMENTO, disponivel ou indisponivel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcaoIptuResponse'
        "401":
          description: "JWT ausente, invalido ou expirado."
        "503":
          description: Falha ao validar token ou consultar ePortal.
      security:
      - bearerAuth: []
  /imoveis/{inscricao}/segunda-via:
    get:
      tags:
      - Imoveis
      summary: Monta somente a opcao de segunda via
      description: "Valida o JWT, consulta o SOAP manual do ePortal VerificaSegundaViaParcelamentoInInscricao\
        \ e retorna a URL da segunda via com token cripto somente quando houver disponibilidade.\
        \ O token da segunda via inclui CPF, inscricao, exercicio, email, nome e data.\
        \ Para anos anteriores, o parametro exercicio deve ser informado."
      parameters:
      - name: inscricao
        in: path
        description: Inscricao imobiliaria usada para gerar o token da segunda via.
          Pode vir sem zeros a esquerda; a API normaliza para 8 posicoes.
        required: true
        schema:
          type: string
        example: "00000018"
      - name: exercicio
        in: query
        description: "Exercicio usado no token da segunda via. Para anos anteriores,\
          \ informar explicitamente; se omitido, usa o ano corrente."
        schema:
          type: string
        example: 2025
      responses:
        "200":
          description: Lista contendo a opcao SEGUNDA_VIA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcaoIptuResponse'
        "401":
          description: "JWT ausente, invalido ou expirado."
        "503":
          description: Falha ao validar token ou gerar URL.
      security:
      - bearerAuth: []
  /infra/heartbeat:
    get:
      tags:
      - Infra
      summary: Verifica se a API esta respondendo
      description: "Heartbeat leve da aplicacao. Para health check completo do Quarkus,\
        \ usar /q/health."
      responses:
        "200":
          description: API respondendo.
  /infra/versao:
    get:
      tags:
      - Infra
      summary: Retorna a versao da API
      description: Endpoint simples para confirmar a versao publicada da api-imoveis.
      responses:
        "200":
          description: Versao da API.

basePath: /v1
definitions:
  handlers.CacheReadRequest:
    properties:
      key:
        example: citizen:12345678901
        type: string
    required:
    - key
    type: object
  handlers.CacheReadResponse:
    properties:
      exists:
        type: boolean
      key:
        type: string
      ttl_seconds:
        type: integer
      value: {}
    type: object
  handlers.EmailValidationRequest:
    description: Estrutura de entrada contendo o endereço de email a ser validado.
    properties:
      email:
        description: |-
          Endereço de email a ser validado.
          example: "usuario@exemplo.com"
        type: string
    required:
    - email
    type: object
  handlers.EmailValidationResponse:
    description: Resultado da validação, contendo informações sobre o endereço de
      email quando válido.
    properties:
      domain:
        description: Domínio do email (após o @)
        type: string
      local_part:
        description: Parte local do email (antes do @)
        type: string
      message:
        description: Mensagem de retorno.
        type: string
      normalized:
        description: Email normalizado (lowercase)
        type: string
      valid:
        description: Indica se o email é válido.
        type: boolean
      validation_type:
        description: Tipo de validação aplicada
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      services:
        additionalProperties:
          $ref: '#/definitions/handlers.ServiceHealth'
        type: object
      status:
        type: boolean
      timestamp:
        type: string
      version:
        type: string
    type: object
  handlers.MemoryModel:
    properties:
      created_at:
        type: string
      description:
        type: string
      memory_id:
        type: string
      memory_name:
        type: string
      memory_type:
        enum:
        - base
        - appended
        type: string
      relevance:
        enum:
        - low
        - medium
        - high
        type: string
      updated_at:
        type: string
      value:
        type: string
    required:
    - description
    - memory_name
    - memory_type
    - relevance
    - value
    type: object
  handlers.PhoneValidationRequest:
    description: Estrutura de entrada contendo o número de telefone a ser validado.
    properties:
      phone:
        description: |-
          Número de telefone em formato internacional ou nacional.
          example: "+55 11 99988-7766"
        type: string
    required:
    - phone
    type: object
  handlers.PhoneValidationResponse:
    description: Resultado da validação, contendo a decomposição (DDI, DDD, número)
      quando válida.
    properties:
      ddd:
        description: DDD (código de área)
        type: string
      ddi:
        description: DDI (código do país)
        type: string
      e164:
        description: Representação E.164 do número
        type: string
      message:
        description: Mensagem de retorno.
        type: string
      numero:
        description: Número do assinante
        type: string
      region:
        description: Região ISO 3166-1 alpha-2
        type: string
      valid:
        description: Indica se o número é válido.
        type: boolean
    type: object

host: localhost:8080
info:
  contact:
    email: suporte@rio.rj.gov.br
    name: Suporte RMI
    url: http://www.rio.rj.gov.br
  description: API para gerenciamento de dados de cidadãos do Rio de Janeiro, incluindo
    autodeclaração de informações e verificação de contato.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API RMI
  version: "1.0"
paths:
  /admin/beta/groups:
    get:
      description: Lista todos os grupos beta com paginação (apenas administradores)
      parameters:
      - description: 'Página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Itens por página (padrão: 10)'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de grupos beta obtida com sucesso
          schema:
            $ref: '#/definitions/models.BetaGroupListResponse'
        "400":
          description: Parâmetros de paginação inválidos
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Token de autenticação não fornecido ou inválido
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Acesso negado - somente administradores
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Muitas requisições - limite de taxa excedido
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar grupos beta
      tags:
      - Beta Groups
    post:
      consumes:
      - application/json
      description: Cria um novo grupo beta para o chatbot (apenas administradores)
      parameters:
      - description: Dados do grupo
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/models.BetaGroupRequest'
      produces:
      - application/json
      responses:
        "201":
